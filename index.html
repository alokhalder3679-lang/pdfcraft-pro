        <h1>PDFCraft Pro — 35 Verified In-Browser Document Tools</h1>
        <p>PDFCraft Pro is an open-source, client-side document processing suite running 100% in-browser via WebAssembly. Zero files or document bytes ever leave your machine.</p>
        <h2>Document Organization &amp; Compression</h2>
        <ul>
          <li><a href="/tools/merge-pdf">Merge PDF</a> — Combine multiple PDF files in any order.</li>
          <li><a href="/tools/split-pdf">Split PDF</a> — Extract pages or split documents into independent files.</li>
          <li><a href="/tools/compress-pdf">Compress PDF</a> — Reduce file size while optimizing visual quality.</li>
          <li><a href="/tools/organize-pdf">Organize PDF</a> — Reorder, rotate, duplicate, or delete PDF pages.</li>
          <li><a href="/tools/crop-pdf">Crop PDF</a> — Crop page margins or trim specific dimensions.</li>
          <li><a href="/tools/rotate-pdf">Rotate PDF</a> — Rotate individual pages or entire documents.</li>
        </ul>
        <h2>Document Conversion</h2>
        <ul>
          <li><a href="/tools/pdf-to-word">PDF to Word</a> — Convert PDF to editable Microsoft Word DOCX documents.</li>
          <li><a href="/tools/word-to-pdf">Word to PDF</a> — Convert DOC and DOCX files into standardized PDF.</li>
          <li><a href="/tools/pdf-to-excel">PDF to Excel</a> — Extract tables and financial data into XLSX.</li>
          <li><a href="/tools/excel-to-pdf">Excel to PDF</a> — Turn spreadsheets into paginated PDF reports.</li>
          <li><a href="/tools/pdf-to-powerpoint">PDF to PowerPoint</a> — Convert slides and presentations to PPTX.</li>
          <li><a href="/tools/powerpoint-to-pdf">PowerPoint to PDF</a> — Convert PPTX presentations to PDF.</li>
          <li><a href="/tools/pdf-to-jpg">PDF to JPG</a> — Convert PDF pages into high-resolution images.</li>
          <li><a href="/tools/jpg-to-pdf">JPG to PDF</a> — Compile photos and images into a PDF document.</li>
          <li><a href="/tools/html-to-pdf">HTML to PDF</a> — Convert HTML webpages and templates to PDF.</li>
          <li><a href="/tools/pdf-to-markdown">PDF to Markdown</a> — Extract structured Markdown text for notes and LLMs.</li>
          <li><a href="/tools/markdown-to-pdf">Markdown to PDF</a> — Render Markdown documents into styled PDFs.</li>
        </ul>
        <h2>Security, Signing &amp; Editing</h2>
        <ul>
          <li><a href="/tools/sign-pdf">Sign PDF</a> — Add digital and handwritten electronic signatures.</li>
          <li><a href="/tools/edit-pdf">Edit PDF</a> — Add text boxes, shapes, annotations, and callouts.</li>
          <li><a href="/tools/protect-pdf">Protect PDF</a> — Encrypt PDF documents with secure passwords.</li>
          <li><a href="/tools/unlock-pdf">Unlock PDF</a> — Remove password protection from authorized files.</li>
          <li><a href="/tools/watermark-pdf">Watermark PDF</a> — Stamp text or image watermarks with custom opacity.</li>
          <li><a href="/tools/redact-pdf">Redact PDF</a> — Permanently sanitize and black out sensitive data and PII.</li>
          <li><a href="/tools/flatten-pdf">Flatten PDF</a> — Lock interactive forms and annotations into static pages.</li>
          <li><a href="/tools/ocr-pdf">OCR PDF</a> — Optical character recognition to make scanned PDFs searchable.</li>
        </ul>
